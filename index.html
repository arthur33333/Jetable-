<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>TempMail - Temporary Email</title>

* { 
margin: 0; 
padding: 0; 
box-sizing: border-box; 
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
} 

body { 
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
min-height: 100vh; 
padding: 20px; 
color: #333; 
} 

.container {

}

header h1 {

} 

header p {

} 

.card {

padding: 25px; 
box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); 
margin-bottom: 20px; 
} 

.email-box { 
display:flex; 
gap: 10px; 
align-items: center;

} 

.email-display { 
flex: 1;

} 

.btn { 
padding: 15px 25px;

border-radius: 10px; 
font-size: 1em; 
font-weight: 600; 
cursor: pointer; 
transition: all 0.3s; 
color:white; 
} 

.btn-primary { 
background: linear-gradient(135deg, #667eea, #764ba2); 
} 

.btn-primary:hover { 
transform: translateY(-2px); 
box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); 
} 

.btn-secondary { 
background: #48bb78; 
} 

.btn-secondary:hover { 
background: #38a169; 
transform: translateY(-2px); 
} 

.btn-small { 
padding: 8px 15px; 
font-size: 0.85em; 
} 

.btn-danger { 
background: #f56565; 
} 

.btn-danger:hover { 
background: #e53e3e; 
} 

.inbox-header { 
display:flex; 
justify-content: space-between; 
align-items: center; 
margin-bottom: 15px; 
flex-wrap:wrap; 
gap: 10px; 
} 

.inbox-header h2 { 
color: #2d3748; 
} 

.email-list { 
display:flex; 
flex-direction: column; 
gap: 10px; 
} 

.email-item { 
padding: 15px; 
background: #f7fafc; 
border-radius: 10px; 
border-left: 4px solid #667eea; 
cursor: pointer; 
transition: all 0.2s; 
} 

.email-item:hover { 
background: #edf2f7; 
transform: translateX(5px); 
} 

.email-from { 
font-weight: 600; 
color: #2d3748; 
margin-bottom: 5px; 
} 

.email-subject { 
color: #4a5568; 
margin-bottom: 5px; 
} 

.email-date { 
font-size: 0.85em; 
color: #a0aec0; 
} 

.empty-state { 
text-align: center; 
padding: 40px; 
color: #a0aec0; 
} 

.empty-state .icon { 
font-size: 3em; 
margin-bottom: 10px; 
} 

.modal { 
display:none; 
position: fixed; 
top: 0; 
left: 0; 
width: 100%; 
height: 100%; 
background: rgba(0, 0, 0, 0.7); 
z-index: 1000; 
justify-content: center; 
align-items: center; 
padding: 20px; 
} 

.modal.active { 
display:flex; 
} 

.modal-content { 
background:white; 
border-radius: 15px; 
padding: 30px; 
max-width: 700px; 
width: 100%; 
max-height: 80vh; 
overflow-y: auto; 
} 

.modal-header { 
display:flex; 
justify-content: space-between; 
align-items: start; 
margin-bottom: 20px; 
gap: 15px; 
} 

.modal-header h3 { 
color: #2d3748; 
word-break: break-word; 
} 

.close-btn { 
background: #f56565; 
color:white; 
border:none;
